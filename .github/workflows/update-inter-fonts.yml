#
# .github/workflows/update-inter-fonts.yml
#
# Monitors rsms/inter for new releases via a weekly schedule poll.
# When a newer Inter version is detected it:
#   1. Downloads the official Inter release ZIP
#   2. Extracts the variable WOFF2 files (roman + italic)
#   3. Removes the previously bundled versioned WOFF2 files
#   4. Writes them as fonts/InterVariable-<ver>.woff2 and
#      fonts/InterVariable-Italic-<ver>.woff2
#   5. Updates fonts/inter-version.txt
#   6. Bumps the app minor version in appinfo/info.xml and CHANGELOG.md
#   7. Commits to a `release/vX.Y.Z` branch and opens a PR labelled
#      `release`
#
# Why a PR and not a push to main
# -------------------------------
# main is covered by the "PR Ruleset": a pull request is mandatory, every
# required check must report green, and the bypass-actor list is empty —
# GitHub Actions included. This workflow used to `git push origin main`
# directly, which the ruleset rejects. The step never actually ran after
# the ruleset went active on 2026-04-27, because Inter has stood at v4.1
# since November 2024; the weekly runs kept reporting green while the one
# branch that mattered was unreachable.
#
# Opening a PR fixes that and buys the font bump a full CI pass on the
# way in: fonts-consistency proves the new WOFF2 filenames match
# inter-version.txt, and the integration smoke tests fetch the new binary
# out of a real Nextcloud before any of it reaches users.
#
# Handing off to release-publish.yml
# ----------------------------------
# The `release` label is what release-publish.yml keys on. When this PR
# merges, that workflow tags the merge commit, builds the App Store
# tarball, publishes the GitHub Release with the tarball attached, and
# POSTs the signed archive to the Nextcloud App Store. Publishing used to
# be duplicated here, and incompletely: it created a GitHub Release with
# no tarball attached and never contacted the App Store at all, so store
# users would not have received the new font.
#
# Why RELEASE_TOKEN
# -----------------
# Same reason as release-prepare.yml: pushes and PRs made with the
# built-in GITHUB_TOKEN do not trigger downstream workflow runs, so the
# PR's required-checks rollup would stay permanently empty and it could
# never merge. See that workflow's header for the one-time PAT setup.
#
# Inter v4.x ZIP layout (confirmed):
#   web/InterVariable.woff2          <- roman variable font
#   web/InterVariable-Italic.woff2   <- italic variable font
#
# Triggers
# --------
# - schedule        : weekly poll every Sunday 02:00 UTC
# - workflow_dispatch: manual run with optional version override

name: Update Inter Fonts

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force a specific Inter tag, e.g. "v4.2". Leave empty for latest.'
        required: false
        default: ""

permissions:
  contents: write        # push the release/* branch (the push itself uses RELEASE_TOKEN)
  pull-requests: write   # gh pr create (likewise)

jobs:
  update-fonts:
    name: Check & update Inter variable fonts
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 0. Guard — fail loudly if RELEASE_TOKEN is missing
      #
      # Checked before anything is downloaded or rewritten, so a missing
      # token cannot leave a half-updated tree or a stale release branch.
      # -----------------------------------------------------------------------
      - name: Verify RELEASE_TOKEN secret is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set — see the header of .github/workflows/release-prepare.yml for the one-time PAT setup."
            exit 1
          fi
          echo "RELEASE_TOKEN is configured."

      # -----------------------------------------------------------------------
      # 1. Checkout with full history so we can branch & commit
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # PAT, not GITHUB_TOKEN — actions/checkout configures git's
          # credential helper from this token, so the later `git push`
          # authenticates as the PAT owner and fires CI normally.
          token: ${{ secrets.RELEASE_TOKEN }}

      # -----------------------------------------------------------------------
      # 2. Resolve target Inter version
      # -----------------------------------------------------------------------
      - name: Resolve target Inter version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment rather than interpolated into the
          # script body, so the dispatch input cannot inject shell.
          FORCE_VERSION: ${{ inputs.force_version }}
        run: |
          if [[ -n "$FORCE_VERSION" ]]; then
            TARGET="$FORCE_VERSION"
          else
            TARGET=$(gh release view --repo rsms/inter --json tagName -q '.tagName')
          fi

          if ! echo "$TARGET" | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "ERROR: unexpected version format: $TARGET" >&2
            exit 1
          fi

          # Strip leading 'v' for use in filenames (matches Application::interVersion())
          VERSION_NUM="${TARGET#v}"

          echo "Resolved Inter version: $TARGET (filename suffix: $VERSION_NUM)"
          echo "target_version=$TARGET"          >> "$GITHUB_OUTPUT"
          echo "target_version_num=$VERSION_NUM" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 3. Read current committed Inter version
      # -----------------------------------------------------------------------
      - name: Read current Inter version
        id: current
        run: |
          if [[ -f fonts/inter-version.txt ]]; then
            CURRENT=$(cat fonts/inter-version.txt | tr -d '[:space:]')
          else
            CURRENT="none"
          fi
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently committed: $CURRENT"

      # -----------------------------------------------------------------------
      # 4. Skip if already up-to-date
      # -----------------------------------------------------------------------
      - name: Check if update is needed
        id: check
        env:
          TARGET:  ${{ steps.resolve.outputs.target_version }}
          CURRENT: ${{ steps.current.outputs.current_version }}
        run: |
          if [[ "$TARGET" == "$CURRENT" ]]; then
            echo "Already at $TARGET - nothing to do."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed: $CURRENT -> $TARGET"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # 5. Compute new app version (bump minor, reset patch)
      # -----------------------------------------------------------------------
      - name: Compute new app version
        id: appver
        if: steps.check.outputs.needs_update == 'true'
        run: |
          CURRENT_APP=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | tr -d '[:space:]')
          MAJOR=$(echo "$CURRENT_APP" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_APP" | cut -d. -f2)

          NEW_MINOR=$(( MINOR + 1 ))
          NEW_APP_VERSION="${MAJOR}.${NEW_MINOR}.0"

          echo "App version: $CURRENT_APP -> $NEW_APP_VERSION"
          echo "current_app_version=$CURRENT_APP" >> "$GITHUB_OUTPUT"
          echo "new_app_version=$NEW_APP_VERSION"  >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. Download Inter release ZIP
      # -----------------------------------------------------------------------
      - name: Download Inter release ZIP
        if: steps.check.outputs.needs_update == 'true'
        env:
          TARGET:      ${{ steps.resolve.outputs.target_version }}
          VERSION_NUM: ${{ steps.resolve.outputs.target_version_num }}
        run: |
          ZIP_URL="https://github.com/rsms/inter/releases/download/${TARGET}/Inter-${VERSION_NUM}.zip"
          echo "Downloading: $ZIP_URL"
          curl -fsSL "$ZIP_URL" -o /tmp/inter.zip
          echo "Downloaded: $(du -h /tmp/inter.zip | cut -f1)"

          echo "WOFF2 files in ZIP:"
          unzip -l /tmp/inter.zip | grep -i '\.woff2' | awk '{print $NF}' | sort

      # -----------------------------------------------------------------------
      # 7. Extract variable WOFF2 files
      #
      # Inter v4.x layout (confirmed):
      #   web/InterVariable.woff2
      #   web/InterVariable-Italic.woff2
      #
      # The script tries three strategies in order, covering past layouts
      # (extras/variable/) and any future renames, so the workflow stays
      # resilient across Inter releases without manual intervention.
      # -----------------------------------------------------------------------
      - name: Extract variable WOFF2 files
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION_NUM: ${{ steps.resolve.outputs.target_version_num }}
        run: |
          mkdir -p /tmp/inter_extracted fonts

          echo "--- Strategy 1: web/InterVariable*.woff2 (v4.x layout) ---"
          unzip -o /tmp/inter.zip \
            'web/InterVariable.woff2' \
            'web/InterVariable-Italic.woff2' \
            -d /tmp/inter_extracted || true

          ROMAN=$(find /tmp/inter_extracted -name 'InterVariable.woff2' | head -1)
          ITALIC=$(find /tmp/inter_extracted -name 'InterVariable-Italic.woff2' | head -1)

          if [[ -z "$ROMAN" || -z "$ITALIC" ]]; then
            echo "--- Strategy 2: extras/variable/Inter[wght].woff2 (pre-v4.x layout) ---"
            unzip -o /tmp/inter.zip \
              '*/extras/variable/*.woff2' \
              -d /tmp/inter_extracted || true

            ROMAN=$(find /tmp/inter_extracted/extras/variable -name '*Variable.woff2' ! -name '*Italic*' | head -1)
            ITALIC=$(find /tmp/inter_extracted/extras/variable -name '*Variable*Italic*.woff2' | head -1)
          fi

          if [[ -z "$ROMAN" || -z "$ITALIC" ]]; then
            echo "--- Strategy 3: full extract + broadest name match ---"
            unzip -o /tmp/inter.zip -d /tmp/inter_extracted 2>/dev/null || true

            # Match any variable WOFF2 that is NOT a static weight file
            ROMAN=$(find /tmp/inter_extracted -name '*.woff2' | grep -i 'variable' | grep -iv 'italic' | grep -iv 'display' | head -1)
            ITALIC=$(find /tmp/inter_extracted -name '*.woff2' | grep -i 'variable' | grep -i 'italic' | grep -iv 'display' | head -1)
          fi

          if [[ -z "$ROMAN" ]]; then
            echo "ERROR: could not locate a roman variable WOFF2 in the ZIP" >&2
            echo "All WOFF2 files present:"
            find /tmp/inter_extracted -name '*.woff2' | sort
            exit 1
          fi
          if [[ -z "$ITALIC" ]]; then
            echo "ERROR: could not locate an italic variable WOFF2 in the ZIP" >&2
            echo "All WOFF2 files present:"
            find /tmp/inter_extracted -name '*.woff2' | sort
            exit 1
          fi

          echo "Roman  : $ROMAN ($(du -h "$ROMAN" | cut -f1))"
          echo "Italic : $ITALIC ($(du -h "$ITALIC" | cut -f1))"

          # Remove any previously bundled versioned WOFF2 files so we don't
          # ship two copies side by side. Match the pattern the PHP code uses.
          rm -f fonts/InterVariable-*.woff2 fonts/InterVariable-Italic-*.woff2

          # Write new files with version embedded in the filename. The PHP
          # FontController allowlist is generated from inter-version.txt,
          # so the names must follow this exact pattern:
          #   InterVariable-<version>.woff2
          #   InterVariable-Italic-<version>.woff2
          cp "$ROMAN"  "fonts/InterVariable-${VERSION_NUM}.woff2"
          cp "$ITALIC" "fonts/InterVariable-Italic-${VERSION_NUM}.woff2"
          echo "${{ steps.resolve.outputs.target_version }}" > fonts/inter-version.txt

          echo "Bundled files:"
          ls -lh fonts/

      # -----------------------------------------------------------------------
      # 8. Bump app version in appinfo/info.xml
      # -----------------------------------------------------------------------
      - name: Bump app version in info.xml
        if: steps.check.outputs.needs_update == 'true'
        env:
          OLD: ${{ steps.appver.outputs.current_app_version }}
          NEW: ${{ steps.appver.outputs.new_app_version }}
        run: |
          sed -i "s|<version>${OLD}</version>|<version>${NEW}</version>|" appinfo/info.xml
          echo "info.xml version: $OLD -> $NEW"

      # -----------------------------------------------------------------------
      # 9. Update CHANGELOG.md (Keep a Changelog format)
      #
      # Promotes ## [Unreleased] content to the new versioned entry (falls
      # back to a generic Changed entry if [Unreleased] is empty).
      # Resets [Unreleased] to empty for the next cycle.
      #
      # The `## [Unreleased]` heading is printed WITHOUT a leading newline
      # on purpose. The head slice already ends with the blank line that
      # separated the heading from the intro, so printing another one grew
      # the gap by exactly one line on every release — it had reached nine
      # by v2.1.3. Keep this printf bare.
      # -----------------------------------------------------------------------
      - name: Update CHANGELOG.md
        if: steps.check.outputs.needs_update == 'true'
        env:
          NEW_APP: ${{ steps.appver.outputs.new_app_version }}
          INTER:   ${{ steps.resolve.outputs.target_version }}
          OLD_APP: ${{ steps.appver.outputs.current_app_version }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          UNRELEASED=$(awk '
            /^## \[Unreleased\]/ { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')

          if [[ -z "$UNRELEASED" ]]; then
            # $INTER already carries its leading 'v' (e.g. "v4.1"), so the
            # tag URL must not add another one.
            BODY="### Changed"$'\n'"- Updated bundled Inter font to ${INTER}."$'\n'"  Source: https://github.com/rsms/inter/releases/tag/${INTER}"
          else
            BODY="$UNRELEASED"
          fi

          printf '\n## %s - %s\n\n%s\n\n' "${NEW_APP}" "${DATE}" "${BODY}" \
            > /tmp/changelog-entry.md

          awk '
            /^## \[Unreleased\]/ { found=1 }
            found && /^## / && !/\[Unreleased\]/ { exit }
            !found { print }
          ' CHANGELOG.md > /tmp/changelog-new.md

          printf '## [Unreleased]\n' >> /tmp/changelog-new.md
          cat /tmp/changelog-entry.md >> /tmp/changelog-new.md

          awk '
            /^## \[Unreleased\]/ { inUnreleased=1; next }
            inUnreleased && /^## / && !/\[Unreleased\]/ { inUnreleased=0; past=1 }
            past { print }
          ' CHANGELOG.md >> /tmp/changelog-new.md

          mv /tmp/changelog-new.md CHANGELOG.md
          echo "CHANGELOG.md updated: added entry for ${NEW_APP}"

      # -----------------------------------------------------------------------
      # 10. Commit on a release/vX.Y.Z branch and push
      # -----------------------------------------------------------------------
      - name: Create release branch and commit
        id: branch
        if: steps.check.outputs.needs_update == 'true'
        env:
          NEW_APP: ${{ steps.appver.outputs.new_app_version }}
          INTER:   ${{ steps.resolve.outputs.target_version }}
        run: |
          set -euo pipefail

          TAG="v${NEW_APP}"
          BRANCH="release/${TAG}"

          # Abort if the tag or the branch already exists on origin — that
          # means an earlier run got part-way and needs cleaning up first.
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "::error::tag $TAG already exists on origin"
            exit 1
          fi
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "::error::branch $BRANCH already exists on origin — close or delete it first"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add fonts/ appinfo/info.xml CHANGELOG.md
          git commit -m "chore(release): bump app to ${NEW_APP}, update Inter font to ${INTER}"

          # release/* is not a protected ref; main is
          git push origin "$BRANCH"
          echo "Pushed: $BRANCH"

          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 11. Ensure the 'release' label exists, then open the PR
      #
      # release-publish.yml filters merged PRs on this exact label, so it is
      # what makes the merge tag, package and publish to the App Store.
      # -----------------------------------------------------------------------
      - name: Ensure 'release' label exists
        if: steps.check.outputs.needs_update == 'true'
        env:
          # GITHUB_TOKEN is fine for label CRUD — labels are not subject to
          # the anti-loop rule that forces the PAT elsewhere in this file.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent — `--force` updates the label if it already exists.
          gh label create release \
            --color C5DEF5 \
            --description "Release prep PR — auto-publishes on merge" \
            --force

      - name: Open release PR
        id: pr
        if: steps.check.outputs.needs_update == 'true'
        env:
          # PAT, NOT GITHUB_TOKEN — `gh pr create` as the PAT owner fires
          # `pull_request: opened` normally, which triggers CI + Integration
          # in the check_suite that branch protection consults.
          GH_TOKEN:      ${{ secrets.RELEASE_TOKEN }}
          NEW_APP:       ${{ steps.appver.outputs.new_app_version }}
          OLD_APP:       ${{ steps.appver.outputs.current_app_version }}
          INTER:         ${{ steps.resolve.outputs.target_version }}
          CURRENT_INTER: ${{ steps.current.outputs.current_version }}
          TAG:           ${{ steps.branch.outputs.tag }}
          BRANCH:        ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail

          # The HTML-comment markers are read back by release-publish.yml
          # from the merged PR body — they survive squash-and-merge because
          # the body is independent of the commit message.
          BODY=$(cat <<EOF
          Automated font update — bundles Inter **${INTER}** (was \`${CURRENT_INTER}\`)
          and bumps the app **${OLD_APP} → ${NEW_APP}**.

          | | |
          |---|---|
          | **App version** | \`${NEW_APP}\` (was \`${OLD_APP}\`) |
          | **Bundled Inter** | [${INTER}](https://github.com/rsms/inter/releases/tag/${INTER}) |

          ### Files updated

          - \`fonts/InterVariable-*.woff2\`
          - \`fonts/InterVariable-Italic-*.woff2\`
          - \`fonts/inter-version.txt\`
          - \`appinfo/info.xml\`
          - \`CHANGELOG.md\`

          When this PR merges into \`main\`, the **Release — Publish** workflow
          fires automatically: it tags \`${TAG}\`, builds the App Store tarball,
          creates the GitHub Release with the tarball attached, and posts the
          signed archive to the Nextcloud App Store.

          <!-- release-publish:prerelease=false -->
          <!-- release-publish:bump=minor -->
          EOF
          )

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): ${TAG} — Inter ${INTER}" \
            --body "$BODY" \
            --label release)

          echo "Opened: $PR_URL"
          echo "::notice title=Font update PR opened::Review and merge: $PR_URL"
